# Local development compose — source-mounted for fast reload.
# Start with: ./dev.sh
# Access directly at localhost:4321 (Astro) and localhost:3000 (API).

name: underlay-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: underlay
      POSTGRES_PASSWORD: underlay
      POSTGRES_DB: underlay
    command: >
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - dev
      - dbaccess-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underlay"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata-dev:/data
    networks:
      - dev

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    networks:
      - dev
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/underlay --ignore-existing;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    ports:
      - "4321:4321"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - ./tools:/app/tools
      - /app/node_modules
    networks:
      - dev
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run dev:server"]
    restart: unless-stopped

networks:
  dev:
    driver: bridge
  dbaccess-dev:
    driver: bridge

volumes:
  pgdata-dev:
  miniodata-dev:
