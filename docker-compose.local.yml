# Local development compose — source-mounted for fast reload.
# Start with: ./dev.sh
# Access at localhost:${PORT:-4100}

name: underlay-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: underlay
      POSTGRES_PASSWORD: underlay
      POSTGRES_DB: underlay
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    ports:
      - '5433:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U underlay']
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - '${PORT:-4100}:${PORT:-4100}'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    env_file:
      - .env.local
    environment:
      PORT: ${PORT:-4100}
      DATABASE_URL: postgresql://underlay:underlay@db:5432/underlay
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "pnpm db:migrate && pnpm db:seed && pnpm dev:app"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata-dev:
  app_node_modules:
