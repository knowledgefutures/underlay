name: CI

run-name: >-
  ${{
    github.event_name == 'push' &&
    format('CI: {0}', github.event.head_commit.message) ||
    format('CI: {0}', github.sha)
  }}

on:
  push:
    branches: [main, v2-edge]
  pull_request:
    branches: [main, v2-edge]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # v2 (packages/*): the root vitest config leaves these out, so they run here.
  v2:
    name: v2 packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm v2:typecheck

      - name: Test
        run: pnpm v2:test

      - name: Browser bundle
        run: pnpm --filter @underlay/protocol check-browser

      - name: CLI build
        run: pnpm --filter @underlay/cli build && node packages/cli/dist/cli.js --help

      - name: Web build and SSR smoke
        run: pnpm --filter @underlay/web build && pnpm --filter @underlay/web smoke
