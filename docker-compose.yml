# Stack file — deploy with: docker stack deploy -c docker-compose.yml <stack-name>
# SOPS decrypts .env.{prod,dev}.enc → .env before this runs (see deploy workflow).

services:
  app:
    image: ${IMAGE:-ghcr.io/knowledgefutures/underlay}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Push commits accumulate per-record structures in memory, so the heap has
      # to scale with the largest collection pushed, not with steady-state
      # traffic. 448 MB could not commit much past ~100k records.
      #
      # Measured: a 500k-record push costs ~900 MB of heap above baseline
      # (~1.8 KB/record), so 2 GB carries a ~1M-record push with headroom.
      # Raise APP_HEAP_MB (and APP_MEMORY_LIMIT with it) for a one-off larger
      # ingest rather than making it the standing default — dev and prod share
      # one 16 GB box, so the defaults here are paid four times over.
      #
      # Do not read this as "3.11M records will fit if we go high enough": at
      # that size the push path needs the streaming commit, not a bigger number.
      # See planning/local/demos/arxiv-ingest-measurements-v1.md.
      NODE_OPTIONS: '--max-old-space-size=${APP_HEAP_MB:-2048}'
      PORT: ${PORT:-3000}
      UNDERLAY_MODE: ${UNDERLAY_MODE:-origin}
      UNDERLAY_UPSTREAM: ${UNDERLAY_UPSTREAM:-}
      UNDERLAY_NODE_NAME: ${UNDERLAY_NODE_NAME:-}
      UNDERLAY_SYNC_SCHEDULE: ${UNDERLAY_SYNC_SCHEDULE:-0 0 * * 0}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          # Must exceed APP_HEAP_MB — the V8 heap is only part of RSS.
          #
          # Sizing on the shared 16 GB box: dev + prod × 2 replicas = 4 app
          # containers. They idle at a few hundred MB each and only one climbs
          # at a time (a push is one request on one replica of one stack), so
          # the realistic peak is 3× idle + 1× limit, not 4× limit. Reservations
          # stay low deliberately — they are what Swarm schedules against, and
          # over-reserving would strand memory the other stack needs.
          memory: ${APP_MEMORY_LIMIT:-2560m}
          cpus: '1.0'
        reservations:
          memory: 384m
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "Promise.all([fetch(\"http://127.0.0.1:${PORT:-3000}/api/health\"),fetch(\"http://127.0.0.1:${PORT:-3000}/\")]).then(rs=>{for(const r of rs)if(!r.ok)throw r.status}).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - appnet

  cron:
    image: ${IMAGE:-ghcr.io/knowledgefutures/underlay}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=128'
      UNDERLAY_MODE: ${UNDERLAY_MODE:-origin}
      UNDERLAY_UPSTREAM: ${UNDERLAY_UPSTREAM:-}
      UNDERLAY_NODE_NAME: ${UNDERLAY_NODE_NAME:-}
      UNDERLAY_SYNC_SCHEDULE: ${UNDERLAY_SYNC_SCHEDULE:-0 0 * * 0}
    command: ['node', '--import', 'tsx/esm', 'tools/cron.ts']
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 192m
          cpus: '0.5'
        reservations:
          memory: 64m
          cpus: '0.1'
      restart_policy:
        condition: any
    tmpfs:
      - /tmp:size=16m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
    networks:
      - appnet

  postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-underlay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-underlay}
      POSTGRES_DB: ${POSTGRES_DB:-underlay}
    command: >
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c max_wal_size=2GB
      -c min_wal_size=256MB
      -c wal_buffers=32MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Postgres allocates dynamic shared memory in /dev/shm for parallel query
    # workers. Docker's 64 MB default is enough for small scans and not enough
    # for a parallel aggregate over a few million rows, which fails with
    # "could not resize shared memory segment ... No space left on device" —
    # observed on a 500k-record commit.
    tmpfs:
      - /dev/shm:size=1g
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - appnet
      - dbaccess
    stop_grace_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 1g
          cpus: '0.5'
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-underlay}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  appnet:
    driver: overlay
  dbaccess:
    driver: overlay
    attachable: true

volumes:
  pgdata:
