# Development compose — source-mounted for fast reload.
# Start with: ./dev.sh

name: underlay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: underlay
      POSTGRES_PASSWORD: underlay
      POSTGRES_DB: underlay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U underlay" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/underlay --ignore-existing;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./astro.config.mjs:/app/astro.config.mjs
      - ./tsconfig.json:/app/tsconfig.json
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - ./tools:/app/tools
      # Keep container's own node_modules
      - /app/node_modules
    ports:
      - "${APP_PORT:-4321}:4321"
      - "${API_PORT:-3000}:3000"
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run dev:server"]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
